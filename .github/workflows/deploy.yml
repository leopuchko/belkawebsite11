name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over rsync/ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: "45.138.25.125"
          USERNAME: "root"
          TARGET: "/var/www/belkadance-by"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "--- target dir before sync ---"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USERNAME@$HOST" "mkdir -p '$TARGET' && ls -la '$TARGET' | head -5"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ "$USERNAME@$HOST:$TARGET/"

      - name: Smoke test
        run: |
          sleep 2
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://belkadance.by/
